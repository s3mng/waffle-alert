spring:
  application:
    name: waffle-alert
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 관리. JPA는 검증만
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    baseline-version: 1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# ───────────────────────────────────────────────
# local: 로컬 Docker MySQL 직접 연결 (docker-compose.yml)
# ───────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/waffle_alert?serverTimezone=UTC&characterEncoding=UTF-8
    username: alert
    password: alertpw
    driver-class-name: com.mysql.cj.jdbc.Driver

---
