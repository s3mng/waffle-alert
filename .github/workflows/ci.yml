name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint, Build & Test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # 와플 공통모듈(spring-waffle)은 GitHub Packages에서 받음. 워크플로우 기본 토큰으로 충분.
      - name: Ktlint check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew ktlintCheck --no-daemon

      # build = compile + Testcontainers MySQL 통합 테스트. (GitHub Actions Docker 지원)
      - name: Build & Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew build --no-daemon
